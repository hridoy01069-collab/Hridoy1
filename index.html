
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkBD</title>
<style>
body{font-family:Arial;background:#f0f2f5;text-align:center;padding:20px}
.card{background:white;padding:20px;border-radius:15px;max-width:350px;margin:auto;box-shadow:0 2px 10px #ccc}
.balance{font-size:28px;color:green;font-weight:bold}
.btn{background:#007bff;color:white;border:none;padding:12px;width:90%;margin:5px;border-radius:8px;font-size:16px}
.btn2{background:#28a745}
</style>
</head>
<body>
<div class="card">
<h2>WorkBD</h2>
<p>Balance</p>
<div class="balance" id="bal">$12.50</div>
<br>
<button class="btn" onclick="add()">Task + $0.50</button>
<button class="btn btn2" onclick="wd()">Withdraw</button>
<p id="msg" style="color:green"></p>
</div>
<script>
let b=12.50;
function up(){document.getElementById('bal').innerText="$"+b.toFixed(2)}
function add(){b+=0.50;up();alert("Added $0.50")}
function wd(){
 if(b<10){alert("Minimum $10 লাগবে, আপনার আছে $"+b.toFixed(2));return;}
 let num=prompt("Bkash/Nagad Number দিন:");
 if(!num)return;
 let amt=prompt("Amount কত? 10 থেকে "+b.toFixed(2),"10");
 if(!amt)return;
 document.getElementById('msg').innerText="Request Sent! Bkash: "+num+" Amount: $"+amt;
 alert("Withdraw Success! 24h এর মধ্যে পাবেন");
 b-=parseFloat(amt);up();
}
up();
</script>
</body>
</html>
