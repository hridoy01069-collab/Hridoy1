<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkBD</title>
<style>
body{font-family:Arial;background:#f0f2f5;text-align:center;padding:15px}
.card{background:white;padding:20px;border-radius:15px;max-width:380px;margin:auto;box-shadow:0 2px 10px #ccc}
.balance{font-size:28px;color:green;font-weight:bold}
.btn{background:#007bff;color:white;border:none;padding:12px;width:90%;margin:5px;border-radius:8px;font-size:16px}
.btn2{background:#28a745}
.list{text-align:left;background:#f9f9f9;padding:10px;border-radius:8px;margin-top:10px;font-size:14px}
</style>
</head>
<body>
<div class="card" id="mainCard">
<h2>WorkBD</h2>
<p>Balance</p>
<div class="balance" id="bal">$12.50</div>
<br>
<button class="btn" onclick="add()">Task + $0.50</button>
<button class="btn btn2" onclick="wd()">Withdraw</button>
<p id="msg" style="color:green"></p>
</div>
<div class="card" id="adminCard" style="display:none;max-width:500px">
<h2>Admin - Withdraw List</h2>
<div id="wdList"></div>
<br>
<button class="btn" onclick="clearAll()">Clear All</button>
<button class="btn btn2" onclick="location.href=location.pathname">Back</button>
</div>
<script>
let b=parseFloat(localStorage.getItem('myBal')||'12.50');
function up(){document.getElementById('bal').innerText="$"+b.toFixed(2);localStorage.setItem('myBal',b)}
function add(){b+=0.50;up();alert("Added $0.50")}
function wd(){
 if(b<10){alert("Minimum $10 লাগবে");return;}
 let num=prompt("Bkash/Nagad Number দিন:");
 if(!num)return;
 let amt=prompt("Amount? 10 থেকে "+b.toFixed(2),"10");
 if(!amt)return;
 amt=parseFloat(amt);
 let all=JSON.parse(localStorage.getItem('withdraws')||'[]');
 all.push({num:num,amt:amt,time:new Date().toLocaleString()});
 localStorage.setItem('withdraws',JSON.stringify(all));
 document.getElementById('msg').innerText="Request Sent! "+num+" $"+amt;
 alert("Withdraw Success!");
 b-=amt;up();
}
function loadAdmin(){
 let all=JSON.parse(localStorage.getItem('withdraws')||'[]');
 if(all.length==0){document.getElementById('wdList').innerHTML="কোনো রিকোয়েস্ট নাই";}
 else{
  let html="";
  all.reverse().forEach((x,i)=>{
   html+=`<div class="list"><b>${i+1}. ${x.num}</b> - $${x.amt}<br><small>${x.time}</small></div>`;
  });
  document.getElementById('wdList').innerHTML=html;
 }
}
function clearAll(){if(confirm("সব ডিলিট?")){localStorage.removeItem('withdraws');loadAdmin();}}
if(location.search.includes("admin")){
 document.getElementById('mainCard').style.display='none';
 document.getElementById('adminCard').style.display='block';
 loadAdmin();
}
up();
</script>
</body>
</html>
